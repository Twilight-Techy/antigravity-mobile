name: antigravity_mobile
description: A mobile client for the Antigravity CLI (agy) running on your own VPS over SSH.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dartssh2: ^2.13.0
  xterm: ^4.0.0
  provider: ^6.1.5
  flutter_markdown_plus: ^1.0.12
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  shared_preferences: ^2.5.0
  flutter_secure_storage: ^11.0.0
  uuid: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
