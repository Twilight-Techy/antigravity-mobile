name: antigravity_mobile
description: A mobile client for the Antigravity CLI (agy) running on your own VPS over SSH.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dartssh2: ^2.13.0
  xterm: ^4.0.0
  provider: ^6.1.5
  flutter_markdown_plus: ^1.0.12
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  shared_preferences: ^2.5.0
  flutter_secure_storage: ^11.0.0
  uuid: ^4.5.0
  url_launcher: ^6.3.3
  markdown: ^7.3.1
  flutter_local_notifications: ^22.3.3
  app_links: ^7.2.2
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
